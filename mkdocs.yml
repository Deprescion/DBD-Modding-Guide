site_name: DBD Modding Wiki
nav:
  - Home: index.md
  - Credits and Resources: credits.md
  - First Setup: prerequisites.md
  - Exploring Game Assets: fmodel.md
  - Creating Mods:
    - Textures: ModDevelopment/Textures/textures.md
    - Materials: 
      - Overview: ModDevelopment/MaterialInstances/overview.md
      - Emissive/Legacy: ModDevelopment/MaterialInstances/mi-emissive.md

theme:
  name: material
  palette:

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      name: Switch to light mode
      toggle:
        icon: material/brightness-4

extra_css:
  - css/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.tasklist